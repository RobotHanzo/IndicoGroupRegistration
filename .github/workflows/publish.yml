name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tooling
        run: pip install build twine

      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          source = pathlib.Path('indico_group_registration/__init__.py').read_text(encoding='utf-8')
          version = re.search(r"^__version__ = '([^']+)'", source, re.M).group(1)
          tag = os.environ['TAG'].removeprefix('v')
          if tag != version:
              sys.exit(f'tag {tag!r} does not match __version__ {version!r}')
          print(f'publishing version {version}')
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      # A plugin whose templates or migrations are missing installs fine and
      # then fails at runtime, so this is worth blocking a release over.
      - name: Make sure templates and migrations are in the wheel
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              'indico_group_registration/templates/_group_panel.html',
              'indico_group_registration/templates/settings.html',
              'indico_group_registration/templates/emails/group_short.txt',
              ('indico_group_registration/templates/customization/core/events/'
               'payment/event_checkout.html'),
          ]
          missing = [n for n in required if n not in names]
          if not any(n.startswith('indico_group_registration/migrations/') and n.endswith('.py')
                     for n in names):
              missing.append('indico_group_registration/migrations/*.py')
          if missing:
              sys.exit(f'missing from {wheel.name}: {missing}')
          print(f'{wheel.name} looks good')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/indico-plugin-group-registration
    permissions:
      # Trusted publishing (OIDC). No API token is stored anywhere; PyPI
      # verifies this workflow's identity instead.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI gets re-run while iterating, and a version that is already
          # there is not a failure worth stopping for.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/indico-plugin-group-registration
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Deliberately no `skip-existing` here: a PyPI upload cannot be undone or
      # replaced, so an attempt to publish a version that already exists is a
      # mistake that should fail loudly rather than pass quietly.
      - uses: pypa/gh-action-pypi-publish@release/v1
