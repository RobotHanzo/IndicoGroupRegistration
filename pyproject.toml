[build-system]
requires = ['hatchling==1.27.0']
build-backend = 'hatchling.build'

[project]
name = 'indico-plugin-group-registration'
description = 'Participant-run group registration with plan-based discounts for Indico'
readme = 'README.md'
license = 'MIT'
authors = [{ name = 'RobotHanzo' }]
classifiers = [
    'Environment :: Plugins',
    'Environment :: Web Environment',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.12',
]
requires-python = '>=3.12.2, <3.13'
dynamic = ['version']
dependencies = [
    # Upper bound on purpose. pip is allowed to *upgrade* Indico to satisfy
    # this, and an Indico whose code is ahead of its database breaks every page
    # that touches a migrated table -- so the range is capped at the series
    # this plugin is tested against. Install with `--no-deps` into an existing
    # Indico venv if you would rather pip did not touch Indico at all.
    'indico>=3.3,<3.4',
]

[project.optional-dependencies]
dev = ['pytest>=8', 'pytest-cov>=5', 'ruff>=0.8']

[project.urls]
Homepage = 'https://github.com/indico/indico'

[project.entry-points.'indico.plugins']
group_registration = 'indico_group_registration.plugin:GroupRegistrationPlugin'

[tool.hatch.version]
path = 'indico_group_registration/__init__.py'

[tool.hatch.build]
include = ['indico_group_registration']
# The webpack bundle under `static/dist/` is a build artifact, so git ignores it
# -- and hatchling follows .gitignore, which would leave it out of the sdist and
# the wheel.  `artifacts` is the override.  Without it, every install is missing
# `static/dist/manifest.json` and Indico raises `Assets for plugin
# group_registration have not been built` on every page the plugin injects a
# bundle into, which is most of the registration module.
artifacts = ['indico_group_registration/static/dist/']

[tool.hatch.build.targets.sdist]
# The sdist has to stay buildable on its own, so it keeps the JS sources and the
# bundle definition webpack reads.
include = ['indico_group_registration', 'tests', 'webpack-bundles.json', 'build-assets.py', 'ruff.toml']

[tool.hatch.build.targets.wheel]
packages = ['indico_group_registration']
# The compiled bundle is what runs; the sources it was built from live in git
# and in the sdist, and webpack already inlines them into the source maps.
exclude = ['indico_group_registration/client/']

[tool.pytest.ini_options]
testpaths = ['tests']
# Indico ships a pytest plugin that pulls in its whole database fixture stack
# (and needs docker).  The unit tests here do not use it.
addopts = '-p no:indico'
